<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>__APP_NAME__ | __TAGLINE__</title>
    <meta name="description" content="__SHORT_DESCRIPTION__">
    <meta name="author" content="Arun Thomas">

    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="__APP_NAME__ | __TAGLINE__">
    <meta property="og:description" content="__SHORT_DESCRIPTION__">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0d10; color: #f3f4f6; }
        .code-font { font-family: 'Fira Code', monospace; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 antialiased">
    <main class="max-w-3xl w-full text-center space-y-8">
        <!-- Logo -->
        <div class="flex justify-center">
            <img src="logo.svg" alt="__APP_NAME__ Logo" class="w-28 h-28 drop-shadow-2xl">
        </div>

        <!-- Headings -->
        <div class="space-y-3">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-orange-500/10 text-orange-400 border border-orange-500/20">
                <span id="version-badge">Loading version...</span> • 100% On-Device
            </div>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight">__APP_NAME__</h1>
            <p class="text-lg text-gray-400 max-w-xl mx-auto">__TAGLINE__</p>
        </div>

        <!-- 1-Click Install Command Box -->
        <div class="glass-card p-5 rounded-2xl max-w-xl mx-auto text-left shadow-2xl">
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Install with 1 Command in Terminal</label>
            <div class="flex items-center gap-3 bg-black/40 p-3 rounded-xl border border-white/5">
                <code id="cmdText" class="code-font text-sm text-orange-300 break-all select-all flex-1">
                    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/USERNAME/APPNAME/main/install-__appname__.command)"
                </code>
                <button onclick="copyCommand()" id="copyBtn" class="bg-orange-500 hover:bg-orange-600 active:scale-95 transition-all text-white px-4 py-2 rounded-lg text-xs font-bold shrink-0">
                    Copy
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-xs text-gray-500 pt-8">
            Built with ❤️ by <a href="https://github.com/arunofhyd" class="text-gray-400 hover:underline">Arun Thomas</a> • <a href="https://github.com/USERNAME/APPNAME" class="text-orange-400 hover:underline">GitHub Repository</a>
        </footer>
    </main>

    <script>
        // Fetch Single Source of Truth version dynamically
        fetch('version.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data.version) {
                    document.getElementById('version-badge').textContent = 'v' + data.version;
                }
            })
            .catch(() => {
                document.getElementById('version-badge').textContent = 'v1.0.0';
            });

        function copyCommand() {
            const text = document.getElementById('cmdText').innerText.trim();
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'Copied!';
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('bg-green-600');
                }, 2000);
            });
        }
    </script>
</body>
</html>
